<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LensLink AI</title>
    
    <style>
        /* --- Basic Setup & Fonts --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d1117;
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- Header & Navigation --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #30363d;
        }

        .logo {
            font-size: 1.8em;
            font-weight: 700;
            color: #58a6ff;
            text-decoration: none;
        }

        nav a {
            color: #c9d1d9;
            text-decoration: none;
            margin-left: 25px;
            font-weight: 300;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #58a6ff;
        }

        /* --- Main Content --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .register-container {
            max-width: 450px;
            width: 100%;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-align: center;
            color: #58a6ff;
        }

        .subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #c9d1d9;
            font-weight: 400;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 5px;
            color: #e0e0e0;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #58a6ff;
        }

        input.error {
            border-color: #f85149;
        }

        .field-error {
            color: #f85149;
            font-size: 0.85em;
            margin-top: 5px;
            display: none;
        }

        .field-error.show {
            display: block;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            font-weight: 600;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .btn-primary:hover {
            background-color: #2ea043;
        }

        .btn-primary:disabled {
            background-color: #30363d;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            background-color: #3d1f1f;
            color: #f85149;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 3px solid #f85149;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            display: none;
            background-color: #1f3d28;
            color: #3fb950;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 3px solid #3fb950;
        }

        .success-message.show {
            display: block;
        }

        .link-section {
            text-align: center;
            margin-top: 20px;
            color: #8b949e;
        }

        .link-section a {
            color: #58a6ff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .link-section a:hover {
            color: #79c0ff;
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #30363d;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <header class="container">
        <a href="/" class="logo">LensLink AI</a>
        <nav>
            <a href="/">Home</a>
            <a href="/cameras.html">Browse Cameras</a>
            <a href="/login.html">Login</a>
        </nav>
    </header>

    <main>
        <div class="register-container">
            <h1>Join LensLink AI</h1>
            <p class="subtitle">Create your account to get started</p>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                    <div class="field-error" id="usernameError"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                    <div class="field-error" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                    <div class="field-error" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
                    <div class="field-error" id="confirmPasswordError"></div>
                </div>

                <button type="submit" class="btn-primary" id="registerBtn">Create Account</button>
            </form>

            <div class="link-section">
                Already have an account? <a href="/login.html">Login here</a>
            </div>
        </div>
    </main>

    <footer class="container">
        <p>&copy; 2025 LensLink AI. All rights reserved.</p>
    </footer>

    <script>
        const registerForm = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }

        function hideMessages() {
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }

        function showFieldError(fieldId, message) {
            const errorElement = document.getElementById(`${fieldId}Error`);
            const inputElement = document.getElementById(fieldId);
            errorElement.textContent = message;
            errorElement.classList.add('show');
            inputElement.classList.add('error');
        }

        function hideFieldError(fieldId) {
            const errorElement = document.getElementById(`${fieldId}Error`);
            const inputElement = document.getElementById(fieldId);
            errorElement.classList.remove('show');
            inputElement.classList.remove('error');
        }

        function hideAllFieldErrors() {
            ['username', 'email', 'password', 'confirmPassword'].forEach(hideFieldError);
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function validateForm() {
            hideAllFieldErrors();
            let isValid = true;

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (username.length < 3) {
                showFieldError('username', 'Username must be at least 3 characters');
                isValid = false;
            }

            if (!validateEmail(email)) {
                showFieldError('email', 'Please enter a valid email address');
                isValid = false;
            }

            if (password.length < 6) {
                showFieldError('password', 'Password must be at least 6 characters');
                isValid = false;
            }

            if (password !== confirmPassword) {
                showFieldError('confirmPassword', 'Passwords do not match');
                isValid = false;
            }

            return isValid;
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            if (!validateForm()) {
                return;
            }

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            registerBtn.disabled = true;
            registerBtn.textContent = 'Creating Account...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Registration successful
                    showSuccess('Account created successfully! Redirecting to login...');
                    registerForm.reset();
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    showError(data.error || 'Registration failed. Please try again.');
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Create Account';
                }
            } catch (error) {
                showError('Connection error. Please check if the server is running.');
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create Account';
            }
        });

        // Real-time validation
        document.getElementById('username').addEventListener('blur', function() {
            if (this.value.trim().length > 0 && this.value.trim().length < 3) {
                showFieldError('username', 'Username must be at least 3 characters');
            } else {
                hideFieldError('username');
            }
        });

        document.getElementById('email').addEventListener('blur', function() {
            if (this.value.trim().length > 0 && !validateEmail(this.value.trim())) {
                showFieldError('email', 'Please enter a valid email address');
            } else {
                hideFieldError('email');
            }
        });

        document.getElementById('confirmPassword').addEventListener('blur', function() {
            const password = document.getElementById('password').value;
            if (this.value.length > 0 && this.value !== password) {
                showFieldError('confirmPassword', 'Passwords do not match');
            } else {
                hideFieldError('confirmPassword');
            }
        });
    </script>
    
    <!-- Language Support -->
    <script src="/public/js/translations.js"></script>
    <script src="/public/js/language.js"></script>

</body>
</html>
