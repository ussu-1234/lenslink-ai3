<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Cameras - LensLink AI</title>
    <link rel="stylesheet" href="/public/css/animations.css">
    
    <style>
        /* --- Basic Setup & Fonts --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d1117;
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- Header & Navigation --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #30363d;
        }

        .logo {
            font-size: 1.8em;
            font-weight: 700;
            color: #58a6ff;
            text-decoration: none;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a, nav span {
            color: #c9d1d9;
            text-decoration: none;
            margin-left: 25px;
            font-weight: 300;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #58a6ff;
        }

        /* --- Main Layout --- */
        main {
            flex: 1;
            padding: 40px 20px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #58a6ff;
        }

        .page-header p {
            color: #8b949e;
            font-size: 1.1em;
        }

        /* --- Search Bar --- */
        .search-section {
            margin-bottom: 30px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            max-width: 600px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 20px;
            font-size: 1em;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 5px;
            color: #e0e0e0;
            font-family: 'Poppins', sans-serif;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .search-bar button {
            padding: 12px 30px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .search-bar button:hover {
            background-color: #2ea043;
        }

        /* --- Browse Layout --- */
        .browse-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            align-items: start;
        }

        /* --- Filters Sidebar --- */
        .filters-sidebar {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            position: sticky;
            top: 20px;
        }

        .filters-sidebar h3 {
            color: #58a6ff;
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .filter-group {
            margin-bottom: 25px;
        }

        .filter-group h4 {
            font-size: 0.95em;
            margin-bottom: 12px;
            color: #c9d1d9;
        }

        .filter-option {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .filter-option input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .filter-option label {
            cursor: pointer;
            font-size: 0.9em;
        }

        .price-range {
            margin-bottom: 10px;
        }

        .price-range input[type="range"] {
            width: 100%;
            margin-top: 10px;
        }

        .price-values {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #8b949e;
            margin-top: 5px;
        }

        .clear-filters {
            width: 100%;
            padding: 10px;
            background-color: #30363d;
            color: #c9d1d9;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s ease;
        }

        .clear-filters:hover {
            background-color: #3d444d;
        }

        /* --- Results Section --- */
        .results-section {
            min-height: 600px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #30363d;
        }

        .results-count {
            color: #8b949e;
        }

        .sort-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .sort-controls label {
            color: #8b949e;
            font-size: 0.9em;
        }

        .sort-controls select {
            padding: 8px 15px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 5px;
            color: #e0e0e0;
            cursor: pointer;
        }

        /* --- Camera Grid --- */
        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .camera-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .camera-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(88, 166, 255, 0.15);
        }

        .favorite-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(22, 27, 34, 0.9);
            border: 1px solid #30363d;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .favorite-btn:hover {
            transform: scale(1.1);
            background-color: rgba(88, 166, 255, 0.2);
            border-color: #58a6ff;
        }

        .camera-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #21262d;
        }

        .card-content {
            padding: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .card-title {
            flex: 1;
        }

        .card-title h3 {
            font-size: 1.2em;
            color: #58a6ff;
            margin-bottom: 5px;
        }

        .card-title .brand {
            font-size: 0.85em;
            color: #8b949e;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9em;
        }

        .rating .stars {
            color: #f1e05a;
        }

        .price {
            font-size: 1.4em;
            font-weight: 600;
            color: #3fb950;
            margin-bottom: 10px;
        }

        .use-cases {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }

        .use-case-tag {
            padding: 4px 10px;
            background-color: #21262d;
            border-radius: 12px;
            font-size: 0.75em;
            color: #8b949e;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .btn-primary {
            background-color: #238636;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2ea043;
        }

        .btn-secondary {
            background-color: #30363d;
            color: #c9d1d9;
        }

        .btn-secondary:hover {
            background-color: #3d444d;
        }

        /* --- Loading & Empty States --- */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #8b949e;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #8b949e;
        }

        .no-results h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #c9d1d9;
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #30363d;
            color: #8b949e;
            margin-top: 60px;
        }

        /* --- Responsive --- */
        @media (max-width: 968px) {
            .browse-layout {
                grid-template-columns: 1fr;
            }

            .filters-sidebar {
                position: static;
            }

            .camera-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }
    </style>
</head>
<body>

    <header class="container">
        <a href="/" class="logo">LensLink AI</a>
        <nav id="mainNav">
            <a href="/">Home</a>
            <a href="/cameras.html">Browse Cameras</a>
            <a href="/#comparisonSection">Compare</a>
        </nav>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>Browse Cameras</h1>
            <p>Discover the perfect camera from our curated collection</p>
        </div>

        <div class="search-section">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search cameras by name, brand, or use case...">
                <button onclick="applyFilters()">Search</button>
            </div>
        </div>

        <div class="browse-layout">
            <!-- Filters Sidebar -->
            <aside class="filters-sidebar">
                <h3>Filters</h3>

                <!-- Brand Filter -->
                <div class="filter-group">
                    <h4>Brand</h4>
                    <div class="filter-option">
                        <input type="checkbox" id="brand-sony" value="Sony" onchange="applyFilters()">
                        <label for="brand-sony">Sony</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="brand-canon" value="Canon" onchange="applyFilters()">
                        <label for="brand-canon">Canon</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="brand-nikon" value="Nikon" onchange="applyFilters()">
                        <label for="brand-nikon">Nikon</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="brand-fujifilm" value="Fujifilm" onchange="applyFilters()">
                        <label for="brand-fujifilm">Fujifilm</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="brand-other" value="Other" onchange="applyFilters()">
                        <label for="brand-other">Other Brands</label>
                    </div>
                </div>

                <!-- Price Range Filter -->
                <div class="filter-group">
                    <h4>Price Range</h4>
                    <div class="price-range">
                        <input type="range" id="priceMin" min="0" max="60000" value="0" step="100" oninput="updatePriceDisplay(); applyFilters()">
                        <input type="range" id="priceMax" min="0" max="60000" value="60000" step="100" oninput="updatePriceDisplay(); applyFilters()">
                    </div>
                    <div class="price-values">
                        <span id="priceMinDisplay">$0</span>
                        <span id="priceMaxDisplay">$60,000</span>
                    </div>
                </div>

                <!-- Sensor Type Filter -->
                <div class="filter-group">
                    <h4>Sensor Type</h4>
                    <div class="filter-option">
                        <input type="checkbox" id="sensor-ff" value="Full-Frame" onchange="applyFilters()">
                        <label for="sensor-ff">Full-Frame</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="sensor-apsc" value="APS-C" onchange="applyFilters()">
                        <label for="sensor-apsc">APS-C</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="sensor-m43" value="Micro Four Thirds" onchange="applyFilters()">
                        <label for="sensor-m43">Micro Four Thirds</label>
                    </div>
                </div>

                <!-- Use Case Filter -->
                <div class="filter-group">
                    <h4>Use Case</h4>
                    <div class="filter-option">
                        <input type="checkbox" id="use-beginner" value="Beginner" onchange="applyFilters()">
                        <label for="use-beginner">Beginner</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="use-professional" value="Professional" onchange="applyFilters()">
                        <label for="use-professional">Professional</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="use-video" value="Video" onchange="applyFilters()">
                        <label for="use-video">Video</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="use-sports" value="Sports" onchange="applyFilters()">
                        <label for="use-sports">Sports</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="use-travel" value="Travel" onchange="applyFilters()">
                        <label for="use-travel">Travel</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="use-vlogging" value="Vlogging" onchange="applyFilters()">
                        <label for="use-vlogging">Vlogging</label>
                    </div>
                </div>

                <button class="clear-filters" onclick="clearAllFilters()">Clear All Filters</button>
            </aside>

            <!-- Results Section -->
            <section class="results-section">
                <div class="results-header">
                    <div class="results-count" id="resultsCount">Loading cameras...</div>
                    <div class="sort-controls">
                        <label for="sortBy">Sort by:</label>
                        <select id="sortBy" onchange="applyFilters()">
                            <option value="rating">Best Rated</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="newest">Newest First</option>
                            <option value="name">Name (A-Z)</option>
                        </select>
                    </div>
                </div>

                <div id="cameraGrid" class="camera-grid">
                    <!-- Loading State -->
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>Loading cameras...</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="container">
        <p>&copy; 2025 LensLink AI. All rights reserved.</p>
    </footer>

    <script src="/public/js/auth.js"></script>
    <script src="/public/js/favorites.js"></script>
    <script>
        let allCameras = [];
        let filteredCameras = [];

        // Load cameras on page load
        async function loadCameras() {
            const grid = document.getElementById('cameraGrid');
            
            // Show loading state
            grid.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
                    <div class="loading-spinner loading-spinner-large" style="margin: 0 auto 20px;"></div>
                    <p style="color: #8b949e;">Loading cameras...</p>
                </div>
            `;
            
            try {
                const response = await fetch('/api/cameras');
                if (!response.ok) throw new Error('Failed to load cameras');
                
                allCameras = await response.json();
                filteredCameras = [...allCameras];
                applyFilters();
            } catch (error) {
                console.error('Error loading cameras:', error);
                grid.innerHTML = `
                    <div class="no-results fade-in">
                        <h3>Failed to load cameras</h3>
                        <p>Please check if the server is running and try again.</p>
                        <button class="btn btn-primary" onclick="loadCameras()" style="margin-top: 20px;">
                            Retry
                        </button>
                    </div>
                `;
            }
        }

        // Apply all filters
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const priceMin = parseInt(document.getElementById('priceMin').value);
            const priceMax = parseInt(document.getElementById('priceMax').value);
            const sortBy = document.getElementById('sortBy').value;

            // Get selected brands
            const selectedBrands = [];
            ['sony', 'canon', 'nikon', 'fujifilm', 'other'].forEach(brand => {
                if (document.getElementById(`brand-${brand}`).checked) {
                    selectedBrands.push(brand === 'other' ? 'Other' : brand.charAt(0).toUpperCase() + brand.slice(1));
                }
            });

            // Get selected sensor types
            const selectedSensors = [];
            ['ff', 'apsc', 'm43'].forEach(sensor => {
                if (document.getElementById(`sensor-${sensor}`).checked) {
                    const sensorMap = {
                        'ff': 'Full-Frame',
                        'apsc': 'APS-C',
                        'm43': 'Micro Four Thirds'
                    };
                    selectedSensors.push(sensorMap[sensor]);
                }
            });

            // Get selected use cases
            const selectedUseCases = [];
            ['beginner', 'professional', 'video', 'sports', 'travel', 'vlogging'].forEach(useCase => {
                if (document.getElementById(`use-${useCase}`).checked) {
                    selectedUseCases.push(useCase.charAt(0).toUpperCase() + useCase.slice(1));
                }
            });

            // Filter cameras
            filteredCameras = allCameras.filter(camera => {
                // Search filter
                if (searchTerm && !camera.name.toLowerCase().includes(searchTerm) && 
                    !camera.brand.toLowerCase().includes(searchTerm) &&
                    !camera.use_case.some(uc => uc.toLowerCase().includes(searchTerm))) {
                    return false;
                }

                // Price filter
                if (camera.price < priceMin || camera.price > priceMax) {
                    return false;
                }

                // Brand filter
                if (selectedBrands.length > 0) {
                    const isOther = !['Sony', 'Canon', 'Nikon', 'Fujifilm'].includes(camera.brand);
                    if (!selectedBrands.includes(camera.brand) && !(selectedBrands.includes('Other') && isOther)) {
                        return false;
                    }
                }

                // Sensor filter
                if (selectedSensors.length > 0) {
                    const matchesSensor = selectedSensors.some(sensor => 
                        camera.specs.sensor_type.includes(sensor) || 
                        (sensor === 'APS-C' && camera.specs.sensor_type.includes('DX'))
                    );
                    if (!matchesSensor) return false;
                }

                // Use case filter
                if (selectedUseCases.length > 0) {
                    const matchesUseCase = selectedUseCases.some(useCase => 
                        camera.use_case.some(uc => uc.includes(useCase))
                    );
                    if (!matchesUseCase) return false;
                }

                return true;
            });

            // Sort cameras
            filteredCameras.sort((a, b) => {
                switch (sortBy) {
                    case 'price-low':
                        return a.price - b.price;
                    case 'price-high':
                        return b.price - a.price;
                    case 'newest':
                        return b.year - a.year;
                    case 'name':
                        return a.name.localeCompare(b.name);
                    case 'rating':
                    default:
                        return b.rating - a.rating;
                }
            });

            displayCameras();
        }

        // Display cameras
        function displayCameras() {
            const grid = document.getElementById('cameraGrid');
            const count = document.getElementById('resultsCount');

            count.textContent = `Showing ${filteredCameras.length} camera${filteredCameras.length !== 1 ? 's' : ''}`;

            if (filteredCameras.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <h3>No cameras found</h3>
                        <p>Try adjusting your filters or search terms</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = '';
            
            filteredCameras.forEach(camera => {
                const card = document.createElement('div');
                card.className = 'camera-card card-interactive fade-in';
                card.onclick = () => viewCamera(camera.id);
                
                card.innerHTML = `
                    <img src="${camera.image}" alt="${camera.name}">
                    <div class="card-content">
                        <div class="card-header">
                            <div class="card-title">
                                <h3>${camera.name}</h3>
                                <div class="brand">${camera.brand}</div>
                            </div>
                            <div class="rating">
                                <span class="stars">★</span>
                                <span>${camera.rating}</span>
                            </div>
                        </div>
                        <div class="price">${camera.price ? `$${camera.price.toLocaleString()}` : 'Price N/A'}</div>
                        <div class="use-cases">
                            ${camera.use_case.slice(0, 3).map(uc => `
                                <span class="use-case-tag">${uc}</span>
                            `).join('')}
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-primary" onclick="event.stopPropagation(); viewCamera('${camera.id}')">
                                View Details
                            </button>
                            <button class="btn btn-secondary" onclick="event.stopPropagation(); addToCompare('${camera.id}')">
                                Compare
                            </button>
                        </div>
                    </div>
                `;
                
                // Add favorite button
                const favoriteBtn = createFavoriteButton(camera.id);
                favoriteBtn.onclick = (e) => {
                    e.stopPropagation();
                    favoriteBtn.click();
                };
                card.appendChild(favoriteBtn);
                
                grid.appendChild(card);
            });
        }

        // View camera details
        function viewCamera(cameraId) {
            window.location.href = `/camera-detail.html?id=${cameraId}`;
        }

        // Add to compare (placeholder)
        function addToCompare(cameraId) {
            alert('Compare feature coming soon! Camera ID: ' + cameraId);
            // TODO: Implement compare functionality
        }

        // Update price display
        function updatePriceDisplay() {
            const min = document.getElementById('priceMin').value;
            const max = document.getElementById('priceMax').value;
            document.getElementById('priceMinDisplay').textContent = `$${parseInt(min).toLocaleString()}`;
            document.getElementById('priceMaxDisplay').textContent = `$${parseInt(max).toLocaleString()}`;
        }

        // Clear all filters
        function clearAllFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('priceMin').value = 0;
            document.getElementById('priceMax').value = 60000;
            updatePriceDisplay();
            
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.getElementById('sortBy').value = 'rating';
            
            applyFilters();
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            updateNavigation();
            updatePriceDisplay();
            loadCameras();
        });

        // Search on Enter key
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') applyFilters();
        });
    </script>

</body>
</html>
