<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Details - LensLink AI</title>
    
    <style>
        /* --- Basic Setup & Fonts --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d1117;
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- Header & Navigation --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #30363d;
        }

        .logo {
            font-size: 1.8em;
            font-weight: 700;
            color: #58a6ff;
            text-decoration: none;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a, nav span {
            color: #c9d1d9;
            text-decoration: none;
            margin-left: 25px;
            font-weight: 300;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #58a6ff;
        }

        /* --- Breadcrumb --- */
        .breadcrumb {
            padding: 20px 0;
            color: #8b949e;
            font-size: 0.9em;
        }

        .breadcrumb a {
            color: #58a6ff;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        /* --- Main Layout --- */
        main {
            flex: 1;
            padding: 20px;
        }

        /* --- Hero Section --- */
        .hero-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 40px;
        }

        .camera-image {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
        }

        .camera-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .camera-info h1 {
            font-size: 2.5em;
            color: #58a6ff;
            margin-bottom: 10px;
        }

        .camera-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .rating {
            color: #f1e05a;
        }

        .price {
            font-size: 2.5em;
            color: #3fb950;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .insight-box {
            background-color: #21262d;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #f1e05a;
            margin-bottom: 20px;
        }

        .insight-box h3 {
            color: #f1e05a;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .use-cases {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .use-case-tag {
            padding: 6px 15px;
            background-color: #21262d;
            border-radius: 15px;
            font-size: 0.85em;
            color: #8b949e;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .favorite-btn {
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 5px;
            width: 60px;
            height: 60px;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .favorite-btn:hover {
            transform: scale(1.1);
            background-color: rgba(88, 166, 255, 0.2);
            border-color: #58a6ff;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #238636;
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background-color: #2ea043;
        }

        .btn-secondary {
            background-color: #1f6feb;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #388bfd;
        }

        /* --- Reviews --- */
        .reviews-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .reviews-summary {
            display: flex;
            flex-direction: column;
            gap: 18px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
        }

        .summary-rating {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .summary-rating .average {
            font-size: 3.2em;
            color: #f1e05a;
            font-weight: 700;
        }

        .summary-meta {
            color: #8b949e;
            font-size: 0.95em;
        }

        .rating-stars {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }

        .rating-stars .star {
            color: #30363d;
            font-size: 1.2em;
        }

        .rating-stars .star.filled {
            color: #f1e05a;
        }

        .rating-distribution {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .distribution-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9em;
            color: #8b949e;
        }

        .distribution-row span {
            width: 30px;
        }

        .rating-bar {
            flex: 1;
            height: 8px;
            background-color: #30363d;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .rating-bar::after {
            content: '';
            display: block;
            height: 100%;
            width: var(--value, 0%);
            background: linear-gradient(90deg, #238636, #58a6ff);
            border-radius: 4px;
        }

        .review-form-container {
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
        }

        .review-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .review-form label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #c9d1d9;
        }

        .review-form select,
        .review-form input,
        .review-form textarea {
            width: 100%;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            color: #e0e0e0;
            font-family: inherit;
            resize: vertical;
        }

        .review-form textarea {
            min-height: 140px;
        }

        .review-form select:focus,
        .review-form input:focus,
        .review-form textarea:focus {
            border-color: #58a6ff;
            outline: none;
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .form-status {
            font-size: 0.9em;
            color: #8b949e;
        }

        .form-status.success {
            color: #3fb950;
        }

        .form-status.error {
            color: #f85149;
        }

        .signin-prompt {
            text-align: center;
            color: #8b949e;
        }

        .signin-prompt a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #1f6feb;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .signin-prompt a:hover {
            background-color: #388bfd;
        }

        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .review-card {
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
        }

        .review-card-own {
            border-color: #58a6ff;
            box-shadow: 0 0 0 1px rgba(88, 166, 255, 0.2);
        }

        .review-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .review-header h3 {
            color: #e0e0e0;
            font-size: 1.1em;
        }

        .review-meta {
            font-size: 0.85em;
            color: #8b949e;
        }

        .review-meta .meta-separator {
            margin: 0 6px;
            color: #30363d;
        }

        .review-body {
            font-size: 0.95em;
            color: #c9d1d9;
            line-height: 1.6;
        }

        .empty-state {
            text-align: center;
            color: #8b949e;
            padding: 20px 0;
        }

        .tag {
            display: inline-block;
            padding: 4px 8px;
            background-color: rgba(88, 166, 255, 0.15);
            color: #58a6ff;
            border-radius: 4px;
            font-size: 0.75em;
            margin-right: 8px;
        }

        /* --- Content Sections --- */
        .content-section {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .content-section h2 {
            font-size: 1.8em;
            color: #58a6ff;
            margin-bottom: 20px;
        }

        /* --- Pros & Cons --- */
        .pros-cons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .pros, .cons {
            background-color: #21262d;
            padding: 20px;
            border-radius: 8px;
        }

        .pros {
            border-left: 4px solid #3fb950;
        }

        .cons {
            border-left: 4px solid #f85149;
        }

        .pros h3 {
            color: #3fb950;
            margin-bottom: 15px;
        }

        .cons h3 {
            color: #f85149;
            margin-bottom: 15px;
        }

        .pros ul, .cons ul {
            list-style: none;
            padding: 0;
        }

        .pros li, .cons li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .pros li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #3fb950;
            font-weight: bold;
        }

        .cons li::before {
            content: '✗';
            position: absolute;
            left: 0;
            color: #f85149;
            font-weight: bold;
        }

        /* --- Specs Table --- */
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .spec-item {
            background-color: #21262d;
            padding: 15px;
            border-radius: 8px;
        }

        .spec-label {
            font-size: 0.85em;
            color: #8b949e;
            margin-bottom: 5px;
        }

        .spec-value {
            font-size: 1.1em;
            color: #e0e0e0;
            font-weight: 600;
        }

        /* --- Buy Options --- */
        .buy-options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .retailer-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #58a6ff;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .retailer-link:hover {
            border-color: #58a6ff;
            background-color: #1c2128;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.2);
        }

        .retailer-icon {
            font-size: 1.5em;
        }

        .retailer-name {
            flex: 1;
        }

        /* --- Alternatives --- */
        .alternatives-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .alternative-card {
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .alternative-card:hover {
            transform: translateY(-5px);
        }

        .alternative-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .alternative-content {
            padding: 15px;
        }

        .alternative-content h4 {
            color: #58a6ff;
            margin-bottom: 5px;
        }

        .alternative-price {
            color: #3fb950;
            font-weight: 600;
            font-size: 1.2em;
        }

        /* --- Loading State --- */
        .loading {
            text-align: center;
            padding: 100px 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #30363d;
            color: #8b949e;
            margin-top: 40px;
        }

        /* --- Responsive --- */
        @media (max-width: 968px) {
            .hero-section {
                grid-template-columns: 1fr;
            }

            .pros-cons-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .summary-rating {
                flex-direction: column;
                align-items: flex-start;
            }

            .form-actions {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <header class="container">
        <a href="/" class="logo">LensLink AI</a>
        <nav id="mainNav">
            <a href="/">Home</a>
            <a href="/cameras.html">Browse Cameras</a>
            <a href="/#comparisonSection">Compare</a>
        </nav>
    </header>

    <main class="container">
        <div class="breadcrumb">
            <a href="/">Home</a> > <a href="/cameras.html">Browse Cameras</a> > <span id="breadcrumbName">Loading...</span>
        </div>

        <div id="cameraContent">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading camera details...</p>
            </div>
        </div>
    </main>

    <footer class="container">
        <p>&copy; 2025 LensLink AI. All rights reserved.</p>
    </footer>

    <script src="/public/js/auth.js"></script>
    <script src="/public/js/favorites.js"></script>
    <script>
        let currentCamera = null;
        let currentUser = null;
        let userReview = null;

        // Get camera ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const cameraId = urlParams.get('id');

        // Load camera details
        async function loadCameraDetails() {
            if (!cameraId) {
                showError('No camera ID provided');
                return;
            }

            try {
                const response = await fetch(`/api/cameras/${cameraId}`);
                if (!response.ok) {
                    throw new Error('Camera not found');
                }

                currentCamera = await response.json();
                displayCamera(currentCamera);
            } catch (error) {
                console.error('Error loading camera:', error);
                showError('Failed to load camera details. Camera may not exist.');
            }
        }

        // Track viewed camera
        function trackViewedCamera(cameraId) {
            try {
                let viewed = JSON.parse(localStorage.getItem('recentlyViewed') || '[]');
                
                // Remove if already exists
                viewed = viewed.filter(id => id !== cameraId);
                
                // Add to beginning
                viewed.unshift(cameraId);
                
                // Keep only last 10
                viewed = viewed.slice(0, 10);
                
                localStorage.setItem('recentlyViewed', JSON.stringify(viewed));
            } catch (error) {
                console.error('Failed to track viewed camera:', error);
            }
        }

        // Display camera details
        function displayCamera(camera) {
            document.getElementById('breadcrumbName').textContent = camera.name;
            document.title = `${camera.name} - LensLink AI`;
            
            // Track this camera as viewed
            if (camera.id) {
                trackViewedCamera(camera.id);
            }

            const numericRating = Number(camera.rating);
            const ratingDisplay = Number.isFinite(numericRating)
                ? numericRating.toFixed(1)
                : (camera.rating || '—');

            const content = `
                <!-- Hero Section -->
                <div class="hero-section">
                    <div class="camera-image">
                        <img src="${camera.image}" alt="${camera.name}">
                    </div>
                    <div class="camera-info">
                        <h1>${camera.name}</h1>
                        <div class="camera-meta">
                            <div class="meta-item">
                                <span class="rating">★</span>
                                <span id="cameraRatingValue">${ratingDisplay}/5</span>
                            </div>
                            <div class="meta-item">
                                <span>${camera.brand}</span>
                            </div>
                            <div class="meta-item">
                                <span>${camera.year}</span>
                            </div>
                        </div>
                        <div class="price">${camera.price ? `$${camera.price.toLocaleString()}` : 'Price N/A'}</div>
                        <div class="insight-box">
                            <h3>💡 AI Insight</h3>
                            <p>${camera.insight}</p>
                        </div>
                        <div class="use-cases">
                            ${camera.use_case.map(uc => `
                                <span class="use-case-tag">${uc}</span>
                            `).join('')}
                        </div>
                        <div class="action-buttons" id="actionButtons">
                            <button class="btn btn-primary" onclick="addToCompare('${camera.id}')">
                                Compare This Camera
                            </button>
                            <button class="btn btn-secondary" onclick="showBuyOptions('${camera.id}', '${camera.name.replace(/'/g, "\\'")}')">
                                Buy Now
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Pros & Cons -->
                <div class="content-section">
                    <h2>Pros & Cons</h2>
                    <div class="pros-cons-grid">
                        <div class="pros">
                            <h3>Pros</h3>
                            <ul>
                                ${camera.pros.map(pro => `<li>${pro}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="cons">
                            <h3>Cons</h3>
                            <ul>
                                ${camera.cons.map(con => `<li>${con}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Detailed Specifications -->
                <div class="content-section">
                    <h2>Detailed Specifications</h2>
                    <div class="specs-grid">
                        ${Object.entries(camera.specs).map(([key, value]) => `
                            <div class="spec-item">
                                <div class="spec-label">${formatSpecLabel(key)}</div>
                                <div class="spec-value">${value}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Similar Cameras -->
                ${camera.alternatives && camera.alternatives.length > 0 ? `
                <div class="content-section">
                    <h2>Similar Cameras You Might Like</h2>
                    <div class="alternatives-grid" id="alternativesGrid">
                        <div class="loading">
                            <p>Loading alternatives...</p>
                        </div>
                    </div>
                </div>
                ` : ''}

                <!-- Where to Buy Section -->
                <div class="content-section" id="whereToBuySection">
                    <h2>Where to Buy</h2>
                    <div id="buyOptions" class="buy-options-grid">
                        <!-- Will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Reviews Section -->
                <div class="content-section reviews-section" id="reviewsSection">
                    <h2>Community Reviews</h2>
                    <div id="reviewsSummary" class="reviews-summary">
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p>Loading reviews...</p>
                        </div>
                    </div>
                    <div id="reviewFormContainer" class="review-form-container"></div>
                    <div id="reviewsList" class="reviews-list"></div>
                </div>
            `;

            document.getElementById('cameraContent').innerHTML = content;

            // Add favorite button
            const actionButtons = document.getElementById('actionButtons');
            if (actionButtons) {
                const favoriteBtn = createFavoriteButton(camera.id);
                actionButtons.appendChild(favoriteBtn);
            }

            // Load alternatives if they exist
            if (camera.alternatives && camera.alternatives.length > 0) {
                loadAlternatives(camera.alternatives);
            }

            // Load reviews
            loadReviews(camera.id);
            
            // Load buy options automatically
            if (camera.name) {
                showBuyOptions(camera.id, camera.name);
            }
        }

        // Load alternative cameras
        async function loadAlternatives(alternativeIds) {
            try {
                const response = await fetch('/api/cameras');
                const allCameras = await response.json();
                
                const alternatives = allCameras.filter(c => alternativeIds.includes(c.id));
                
                const grid = document.getElementById('alternativesGrid');
                grid.innerHTML = alternatives.map(alt => `
                    <div class="alternative-card" onclick="viewCamera('${alt.id}')">
                        <img src="${alt.image}" alt="${alt.name}">
                        <div class="alternative-content">
                            <h4>${alt.name}</h4>
                            <p class="alternative-price">${alt.price ? `$${alt.price.toLocaleString()}` : 'Price N/A'}</p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading alternatives:', error);
            }
        }

        // Format spec label
        function formatSpecLabel(key) {
            return key.split('_').map(word => 
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
        }

        // Show error
        function showError(message) {
            document.getElementById('cameraContent').innerHTML = `
                <div class="content-section" style="text-align: center; padding: 60px 20px;">
                    <h2 style="color: #f85149; margin-bottom: 15px;">Camera Not Found</h2>
                    <p style="color: #8b949e; margin-bottom: 25px;">${message}</p>
                    <a href="/cameras.html" class="btn btn-primary" style="display: inline-block; text-decoration: none;">
                        Browse All Cameras
                    </a>
                </div>
            `;
        }

        // View another camera
        function viewCamera(cameraId) {
            window.location.href = `/camera-detail.html?id=${cameraId}`;
        }

        // Add to compare
        function addToCompare(cameraId) {
            // Store in session storage for compare functionality
            let compareList = JSON.parse(sessionStorage.getItem('compareList') || '[]');
            if (!compareList.includes(cameraId)) {
                compareList.push(cameraId);
                sessionStorage.setItem('compareList', JSON.stringify(compareList));
            }
            
            if (compareList.length >= 2) {
                window.location.href = `/?compare=${compareList.join(',')}`;
            } else {
                alert(`Added to compare! Select ${2 - compareList.length} more camera(s) to compare.`);
            }
        }

        // Show buy options
        function showBuyOptions(cameraId, cameraName) {
            const retailers = [
                { name: 'Amazon', url: `https://www.amazon.com/s?k=${encodeURIComponent(cameraName)}`, icon: '🛒' },
                { name: 'B&H Photo', url: `https://www.bhphotovideo.com/c/search?q=${encodeURIComponent(cameraName)}`, icon: '📷' },
                { name: 'Adorama', url: `https://www.adorama.com/l/?searchinfo=${encodeURIComponent(cameraName)}`, icon: '🎥' },
                { name: 'Best Buy', url: `https://www.bestbuy.com/site/searchpage.jsp?st=${encodeURIComponent(cameraName)}`, icon: '🏪' }
            ];
            
            const optionsHtml = retailers.map(retailer => `
                <a href="${retailer.url}" target="_blank" rel="noopener" class="retailer-link">
                    <span class="retailer-icon">${retailer.icon}</span>
                    <span class="retailer-name">Buy on ${retailer.name}</span>
                    <span>→</span>
                </a>
            `).join('');
            
            const buyOptionsEl = document.getElementById('buyOptions');
            if (buyOptionsEl) {
                buyOptionsEl.innerHTML = optionsHtml;
                const whereToBuySection = document.getElementById('whereToBuySection');
                if (whereToBuySection) {
                    setTimeout(() => {
                        whereToBuySection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 100);
                }
            } else {
                // Fallback: open Amazon in new tab
                window.open(`https://www.amazon.com/s?k=${encodeURIComponent(cameraName)}`, '_blank');
            }
        }

        function escapeHtml(value) {
            if (value === undefined || value === null) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatDate(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            if (Number.isNaN(date.getTime())) {
                return '';
            }
            return date.toLocaleDateString(undefined, {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function renderStars(ratingValue) {
            const rounded = Math.round(Number(ratingValue) || 0);
            const stars = [];
            for (let i = 1; i <= 5; i++) {
                stars.push(`<span class="star ${i <= rounded ? 'filled' : ''}">★</span>`);
            }
            return stars.join('');
        }

        function renderReviewSummary(data) {
            const summaryEl = document.getElementById('reviewsSummary');
            if (!summaryEl) return;

            const averageRating = Number(data?.averageRating) || 0;
            const totalReviews = Number(data?.totalReviews) || 0;
            const distribution = data?.ratingDistribution || {};
            const hasReviews = totalReviews > 0;

            const distributionHtml = hasReviews
                ? [5, 4, 3, 2, 1].map(rating => {
                    const count = Number(distribution[rating]) || 0;
                    const percent = totalReviews ? Math.round((count / totalReviews) * 100) : 0;
                    return `
                        <div class="distribution-row">
                            <span>${rating}★</span>
                            <div class="rating-bar" style="--value:${percent}%"></div>
                            <span>${count}</span>
                        </div>
                    `;
                }).join('')
                : '<p class="empty-state" style="padding: 0;">No reviews yet.</p>';

            summaryEl.innerHTML = `
                <div class="summary-rating">
                    <div class="average">${hasReviews ? averageRating.toFixed(1) : '—'}</div>
                    <div class="summary-meta">
                        <div class="rating-stars">${renderStars(averageRating)}</div>
                        <p>${hasReviews ? `${totalReviews} review${totalReviews === 1 ? '' : 's'}` : 'Be the first to review this camera.'}</p>
                    </div>
                </div>
                <div class="rating-distribution">
                    ${distributionHtml}
                </div>
            `;
        }

        function renderReviewForm(data) {
            const container = document.getElementById('reviewFormContainer');
            if (!container) return;

            if (!currentCamera) {
                container.innerHTML = '';
                return;
            }

            if (!currentUser) {
                container.innerHTML = `
                    <div class="signin-prompt">
                        <p>Log in to share your experience with this camera.</p>
                        <a href="/login.html">Login to review</a>
                        <p style="margin-top: 12px; font-size: 0.85em;">New to LensLink? <a href="/register.html" style="color: #58a6ff;">Create an account</a></p>
                    </div>
                `;
                return;
            }

            userReview = data?.myReview || null;

            const selectedRating = Number(userReview?.rating) || 5;
            const ratingOptions = [5, 4, 3, 2, 1].map(value => `
                <option value="${value}" ${value === selectedRating ? 'selected' : ''}>
                    ${value} Star${value === 1 ? '' : 's'}
                </option>
            `).join('');

            container.innerHTML = `
                <form id="reviewForm" class="review-form">
                    <div>
                        <label for="reviewRating">Rating</label>
                        <select id="reviewRating" required>
                            ${ratingOptions}
                        </select>
                    </div>
                    <div>
                        <label for="reviewTitle">Title <span style="font-weight: 400; color: #8b949e;">(optional)</span></label>
                        <input type="text" id="reviewTitle" maxlength="120" value="${escapeHtml(userReview?.title || '')}">
                    </div>
                    <div>
                        <label for="reviewContent">Your Review</label>
                        <textarea id="reviewContent" rows="5" maxlength="2000" required>${escapeHtml(userReview?.content || '')}</textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">${userReview ? 'Update Review' : 'Submit Review'}</button>
                        ${userReview ? '<button type="button" class="btn btn-secondary" id="deleteReviewButton">Delete Review</button>' : ''}
                        <span id="reviewFormStatus" class="form-status"></span>
                    </div>
                </form>
            `;

            const form = document.getElementById('reviewForm');
            if (form) {
                form.addEventListener('submit', async (event) => {
                    event.preventDefault();
                    await submitReview();
                });
            }

            const deleteButton = document.getElementById('deleteReviewButton');
            if (deleteButton) {
                deleteButton.addEventListener('click', async () => {
                    await deleteReview();
                });
            }
        }

        function renderReviewsList(reviews = []) {
            const listEl = document.getElementById('reviewsList');
            if (!listEl) return;

            if (!reviews.length) {
                listEl.innerHTML = `<p class="empty-state">No reviews yet. Be the first to share your hands-on experience!</p>`;
                return;
            }

            const reviewCards = reviews.map(review => {
                const safeTitle = escapeHtml(review.title || 'Review');
                const safeContent = escapeHtml(review.content || '').replace(/\n/g, '<br>');
                const displayDate = formatDate(review.updated_at || review.created_at);
                const isUpdated = review.updated_at && review.updated_at !== review.created_at;

                const metaSegments = [];
                if (review.ownedByMe) {
                    metaSegments.push('<span class="tag">Your review</span>');
                }
                metaSegments.push(`<span>${escapeHtml(review.username || 'Anonymous')}</span>`);
                if (displayDate) {
                    metaSegments.push(`<span>${displayDate}</span>`);
                }
                if (isUpdated) {
                    metaSegments.push('<span>Updated</span>');
                }

                const metaHtml = metaSegments.join('<span class="meta-separator">·</span>');

                return `
                    <article class="review-card ${review.ownedByMe ? 'review-card-own' : ''}">
                        <header class="review-header">
                            <div>
                                <h3>${safeTitle}</h3>
                                <div class="review-meta">${metaHtml}</div>
                            </div>
                            <div class="review-rating rating-stars">${renderStars(review.rating)}</div>
                        </header>
                        <div class="review-body">${safeContent}</div>
                    </article>
                `;
            }).join('');

            listEl.innerHTML = reviewCards;
        }

        async function loadReviews(cameraId) {
            const summaryEl = document.getElementById('reviewsSummary');
            const listEl = document.getElementById('reviewsList');
            const formContainer = document.getElementById('reviewFormContainer');

            if (!summaryEl || !listEl || !formContainer) return;

            summaryEl.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading reviews...</p>
                </div>
            `;

            try {
                const response = await fetch(`/api/reviews/${cameraId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch reviews');
                }

                const data = await response.json();
                userReview = data?.myReview || null;

                renderReviewSummary(data);
                renderReviewForm(data);
                renderReviewsList(data?.reviews || []);
                updateAverageRatingDisplay(data);
            } catch (error) {
                console.error('Load reviews error:', error);
                summaryEl.innerHTML = `<p class="form-status error">Unable to load reviews right now.</p>`;
                listEl.innerHTML = '';
                formContainer.innerHTML = '<p class="form-status error">Unable to load review form.</p>';
            }
        }

        function updateAverageRatingDisplay(data) {
            if (!data || !data.totalReviews) return;
            const ratingEl = document.getElementById('cameraRatingValue');
            if (!ratingEl) return;

            const average = Number(data.averageRating);
            if (Number.isFinite(average)) {
                ratingEl.textContent = `${average.toFixed(1)}/5`;
            }
        }

        async function submitReview() {
            if (!currentCamera) return;

            const ratingInput = document.getElementById('reviewRating');
            const titleInput = document.getElementById('reviewTitle');
            const contentInput = document.getElementById('reviewContent');
            const statusEl = document.getElementById('reviewFormStatus');
            const submitButton = document.querySelector('#reviewForm button[type="submit"]');

            if (!ratingInput || !contentInput) return;

            const payload = {
                cameraId: currentCamera.id,
                rating: Number(ratingInput.value),
                title: titleInput ? titleInput.value.trim() : '',
                content: contentInput.value.trim()
            };

            const isUpdate = Boolean(userReview && userReview.id);
            const endpoint = isUpdate ? `/api/reviews/${userReview.id}` : '/api/reviews';
            const method = isUpdate ? 'PUT' : 'POST';

            if (statusEl) {
                statusEl.textContent = 'Saving...';
                statusEl.className = 'form-status';
            }
            if (submitButton) {
                submitButton.disabled = true;
            }

            try {
                const response = await fetch(endpoint, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to save review');
                }

                await loadReviews(currentCamera.id);

                const messageEl = document.getElementById('reviewFormStatus');
                if (messageEl) {
                    messageEl.textContent = isUpdate ? 'Review updated successfully.' : 'Review submitted successfully.';
                    messageEl.className = 'form-status success';
                }
            } catch (error) {
                console.error('Submit review error:', error);
                if (statusEl) {
                    statusEl.textContent = error.message;
                    statusEl.className = 'form-status error';
                }
            } finally {
                if (submitButton) {
                    submitButton.disabled = false;
                }
            }
        }

        async function deleteReview() {
            if (!userReview || !userReview.id || !currentCamera) return;

            const confirmDelete = window.confirm('Delete your review?');
            if (!confirmDelete) return;

            const deleteButton = document.getElementById('deleteReviewButton');
            const statusEl = document.getElementById('reviewFormStatus');

            if (statusEl) {
                statusEl.textContent = 'Deleting...';
                statusEl.className = 'form-status';
            }
            if (deleteButton) {
                deleteButton.disabled = true;
            }

            try {
                const response = await fetch(`/api/reviews/${userReview.id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to delete review');
                }

                userReview = null;
                await loadReviews(currentCamera.id);

                const messageEl = document.getElementById('reviewFormStatus');
                if (messageEl) {
                    messageEl.textContent = 'Review deleted.';
                    messageEl.className = 'form-status success';
                }
            } catch (error) {
                console.error('Delete review error:', error);
                if (statusEl) {
                    statusEl.textContent = error.message;
                    statusEl.className = 'form-status error';
                }
            } finally {
                if (deleteButton) {
                    deleteButton.disabled = false;
                }
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', async () => {
            currentUser = await checkAuth();
            await updateNavigation();
            loadCameraDetails();
        });
    </script>

</body>
</html>
