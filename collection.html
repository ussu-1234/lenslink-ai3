<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Camera Collection - LensLink AI</title>
    <meta name="description" content="Track and manage your camera collection. Add cameras you own, view specs, and compare with others.">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: #e0e0e0;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }

        header h1 {
            font-size: 2.5em;
            color: #58a6ff;
            margin-bottom: 10px;
        }

        nav {
            background: #0d1117;
            padding: 15px 20px;
            border-bottom: 1px solid #30363d;
        }

        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: #58a6ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #79c0ff;
        }

        .collection-section {
            padding: 40px 20px;
        }

        .collection-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 2em;
            color: #58a6ff;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: #8b949e;
            font-size: 0.9em;
        }

        .collection-actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #238636;
            color: white;
        }

        .btn-primary:hover {
            background: #2ea043;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
        }

        .btn-secondary {
            background: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
        }

        .btn-secondary:hover {
            border-color: #58a6ff;
            background: #1c2128;
        }

        .cameras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .camera-card {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .camera-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(88, 166, 255, 0.2);
        }

        .camera-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #161b22;
        }

        .camera-card-content {
            padding: 20px;
        }

        .camera-card h3 {
            color: #58a6ff;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .camera-card .price {
            color: #3fb950;
            font-size: 1.2em;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .camera-card .specs {
            list-style: none;
            padding: 0;
            margin-bottom: 15px;
        }

        .camera-card .specs li {
            padding: 5px 0;
            color: #8b949e;
            font-size: 0.9em;
        }

        .camera-card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .camera-card-actions .btn {
            flex: 1;
            padding: 10px;
            font-size: 0.9em;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8b949e;
        }

        .empty-state h2 {
            color: #58a6ff;
            margin-bottom: 15px;
        }

        .add-camera-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .add-camera-modal.active {
            display: flex;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: #58a6ff;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .search-input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .camera-search-results {
            max-height: 400px;
            overflow-y: auto;
        }

        .search-result-item {
            padding: 15px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-result-item:hover {
            border-color: #58a6ff;
            background: #1c2128;
        }

        .search-result-item h4 {
            color: #58a6ff;
            margin-bottom: 5px;
        }

        .search-result-item .price {
            color: #3fb950;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .cameras-grid {
                grid-template-columns: 1fr;
            }

            .collection-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="/">← Back to Home</a>
            <a href="/profile.html">My Profile</a>
        </div>
    </nav>

    <header>
        <div class="container">
            <h1>📷 My Camera Collection</h1>
            <p>Track and manage your camera gear</p>
        </div>
    </header>

    <div class="container">
        <div class="collection-section">
            <div class="collection-stats">
                <div class="stat-card">
                    <div class="number" id="totalCameras">0</div>
                    <div class="label">Total Cameras</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalValue">$0</div>
                    <div class="label">Total Value</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="avgRating">0</div>
                    <div class="label">Average Rating</div>
                </div>
            </div>

            <div class="collection-actions">
                <button class="btn btn-primary" onclick="openAddCameraModal()">+ Add Camera</button>
                <button class="btn btn-secondary" onclick="exportCollection()">Export Collection</button>
                <button class="btn btn-secondary" onclick="clearCollection()">Clear All</button>
            </div>

            <div id="collectionContainer">
                <div class="empty-state">
                    <h2>Your collection is empty</h2>
                    <p>Start by adding cameras you own to track your gear!</p>
                    <button class="btn btn-primary" onclick="openAddCameraModal()" style="margin-top: 20px;">Add Your First Camera</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Camera Modal -->
    <div class="add-camera-modal" id="addCameraModal">
        <div class="modal-content">
            <h2>Add Camera to Collection</h2>
            <input type="text" class="search-input" id="cameraSearchInput" placeholder="Search for a camera..." oninput="searchCameras(this.value)">
            <div class="camera-search-results" id="cameraSearchResults"></div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-secondary" onclick="closeAddCameraModal()" style="flex: 1;">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/public/js/auth.js"></script>
    <script>
        const COLLECTION_STORAGE_KEY = 'lenslinkCameraCollection';

        function getCollection() {
            try {
                const data = localStorage.getItem(COLLECTION_STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (error) {
                console.error('Failed to load collection:', error);
                return [];
            }
        }

        function saveCollection(collection) {
            localStorage.setItem(COLLECTION_STORAGE_KEY, JSON.stringify(collection));
        }

        function addCamera(camera) {
            const collection = getCollection();
            if (collection.some(c => c.id === camera.id)) {
                alert('This camera is already in your collection!');
                return;
            }
            collection.push({
                ...camera,
                addedAt: Date.now()
            });
            saveCollection(collection);
            renderCollection();
            closeAddCameraModal();
        }

        function removeCamera(cameraId) {
            if (confirm('Remove this camera from your collection?')) {
                const collection = getCollection();
                const filtered = collection.filter(c => c.id !== cameraId);
                saveCollection(filtered);
                renderCollection();
            }
        }

        function renderCollection() {
            const collection = getCollection();
            const container = document.getElementById('collectionContainer');

            // Update stats
            document.getElementById('totalCameras').textContent = collection.length;
            
            const totalValue = collection.reduce((sum, c) => sum + (c.price || 0), 0);
            document.getElementById('totalValue').textContent = `$${totalValue.toLocaleString()}`;
            
            const avgRating = collection.length > 0
                ? (collection.reduce((sum, c) => sum + (c.rating || 0), 0) / collection.length).toFixed(1)
                : 0;
            document.getElementById('avgRating').textContent = avgRating;

            if (collection.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>Your collection is empty</h2>
                        <p>Start by adding cameras you own to track your gear!</p>
                        <button class="btn btn-primary" onclick="openAddCameraModal()" style="margin-top: 20px;">Add Your First Camera</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="cameras-grid">
                    ${collection.map(camera => `
                        <div class="camera-card">
                            <img src="${camera.image || '/images/placeholder.jpg'}" alt="${camera.name}" onerror="this.src='/images/placeholder.jpg'">
                            <div class="camera-card-content">
                                <h3>${camera.name}</h3>
                                <div class="price">$${camera.price?.toLocaleString() || 'N/A'}</div>
                                <ul class="specs">
                                    ${camera.specs ? Object.entries(camera.specs).slice(0, 3).map(([key, value]) => 
                                        `<li>${key.replace(/_/g, ' ')}: ${value}</li>`
                                    ).join('') : ''}
                                </ul>
                                <div class="camera-card-actions">
                                    <button class="btn btn-secondary" onclick="window.location.href='/camera-detail.html?id=${camera.id}'">
                                        View Details
                                    </button>
                                    <button class="btn btn-secondary" onclick="removeCamera('${camera.id}')">
                                        Remove
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        async function searchCameras(query) {
            if (!query || query.length < 2) {
                document.getElementById('cameraSearchResults').innerHTML = '';
                return;
            }

            try {
                const response = await fetch('/api/cameras');
                const cameras = await response.json();
                
                const filtered = cameras.filter(camera => 
                    camera.name.toLowerCase().includes(query.toLowerCase()) ||
                    camera.brand?.toLowerCase().includes(query.toLowerCase())
                ).slice(0, 10);

                const resultsContainer = document.getElementById('cameraSearchResults');
                if (filtered.length === 0) {
                    resultsContainer.innerHTML = '<p style="color: #8b949e; text-align: center; padding: 20px;">No cameras found</p>';
                    return;
                }

                resultsContainer.innerHTML = filtered.map(camera => `
                    <div class="search-result-item" onclick="addCamera(${JSON.stringify(camera).replace(/"/g, '&quot;')})">
                        <h4>${camera.name}</h4>
                        <p style="color: #8b949e; margin: 5px 0;">${camera.brand || ''}</p>
                        <div class="price">$${camera.price?.toLocaleString() || 'N/A'}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to search cameras:', error);
            }
        }

        function openAddCameraModal() {
            document.getElementById('addCameraModal').classList.add('active');
            document.getElementById('cameraSearchInput').focus();
        }

        function closeAddCameraModal() {
            document.getElementById('addCameraModal').classList.remove('active');
            document.getElementById('cameraSearchInput').value = '';
            document.getElementById('cameraSearchResults').innerHTML = '';
        }

        function exportCollection() {
            const collection = getCollection();
            const data = {
                exportDate: new Date().toISOString(),
                totalCameras: collection.length,
                cameras: collection
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `camera-collection-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearCollection() {
            if (confirm('Are you sure you want to clear your entire collection? This cannot be undone.')) {
                localStorage.removeItem(COLLECTION_STORAGE_KEY);
                renderCollection();
            }
        }

        // Close modal on background click
        document.getElementById('addCameraModal').addEventListener('click', (e) => {
            if (e.target.id === 'addCameraModal') {
                closeAddCameraModal();
            }
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            renderCollection();
            if (typeof updateNavigation === 'function') {
                updateNavigation();
            }
        });
    </script>
    
    <!-- Language Support -->
    <script src="/public/js/translations.js"></script>
    <script src="/public/js/language.js"></script>
</body>
</html>
